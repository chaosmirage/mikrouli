<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Anti-flash pre-React cascade. Runs synchronously in <head> BEFORE the
         bundle so the very first paint is already in the correct visual mode.
         Mirrors the React provider's cascade exactly: localStorage ->
         OS preference -> light. Validates strictly against the same three
         ThemeMode literals (any other value falls through). Must not diverge
         from the provider — both sides own the mikrouli.themeMode contract. -->
    <script>
      (function () {
        var STORAGE_KEY = 'mikrouli.themeMode';
        var mode = 'follow-system';
        try {
          var raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw === 'light' || raw === 'dark' || raw === 'follow-system') {
            mode = raw;
          }
        } catch (e) {
          /* private mode / disabled storage — fall through */
        }
        var effective = mode;
        if (mode === 'follow-system') {
          var prefersDark = false;
          try {
            prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {
            /* matchMedia absent — leave prefersDark false (fail-safe) */
          }
          effective = prefersDark ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.setAttribute('data-mui-color-scheme', effective);
        // Body background set via a CSS variable so CssBaseline's later rules
        // don't have to race: the var is consumed inline below. Both literals
        // are the theme factory's canvas token per mode — they must not
        // diverge from it.
        var bg = effective === 'dark' ? '#000000' : '#f8fafc';
        root.style.setProperty('--mikrouli-initial-bg', bg);
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', bg);
        } else {
          metaTheme = document.createElement('meta');
          metaTheme.setAttribute('name', 'theme-color');
          metaTheme.setAttribute('content', bg);
          document.head.appendChild(metaTheme);
        }
        document.addEventListener('DOMContentLoaded', function () {
          document.body.style.backgroundColor = bg;
        });
      })();
    </script>
    <style>
      body {
        background-color: var(--mikrouli-initial-bg, #f8fafc);
      }
    </style>

    <!-- Primary meta -->
    <title>mikrouli — Shorten your links, track every click</title>
    <meta
      name="description"
      content="Free URL shortener with click analytics and QR codes (PNG and SVG). Shorten links with no account, automate via REST API or MCP for AI agents."
    />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="canonical" href="https://mikrou.li/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Telegram, Discord, Signal) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mikrouli" />
    <meta property="og:title" content="mikrouli — Shorten your links, track every click" />
    <meta
      property="og:description"
      content="Free URL shortener with click analytics and QR codes (PNG and SVG). Shorten links with no account, automate via REST API or MCP for AI agents."
    />
    <meta property="og:url" content="https://mikrou.li/" />
    <meta property="og:image" content="https://mikrou.li/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="mikrouli — Shorten your links, track every click" />
    <meta
      name="twitter:description"
      content="Free URL shortener with click analytics, QR codes, and MCP for AI agents."
    />
    <meta name="twitter:image" content="https://mikrou.li/og-image.png" />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "mikrouli",
        "applicationCategory": "WebApplication",
        "operatingSystem": "Web",
        "description": "Free URL shortener with click analytics and QR codes (PNG and SVG). Shorten links with no account, automate via REST API or MCP for AI agents.",
        "url": "https://mikrou.li/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "URL shortening",
          "QR code download (PNG and SVG)",
          "Click analytics",
          "REST API",
          "MCP server for AI agents",
          "Interface in English, German, and Greek"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        mikrouli requires JavaScript to run. The landing page describes a free URL shortener with
        built-in analytics -- please enable JavaScript or visit the
        <a href="/sitemap.xml">sitemap</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
