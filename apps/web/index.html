<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>mikrouli — Shorten your links, track every click</title>
    <meta
      name="description"
      content="Free, simple URL shortener with built-in click analytics. Shorten links in one second, track clicks by country and browser, automate via REST API."
    />
    <meta name="theme-color" content="#191919" />
    <link rel="canonical" href="https://mikrouli.example.com/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Telegram, Discord, Signal) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mikrouli" />
    <meta property="og:title" content="mikrouli — Shorten your links, track every click" />
    <meta
      property="og:description"
      content="Free, simple URL shortener with built-in click analytics. Shorten links in one second, track clicks by country and browser, automate via REST API."
    />
    <meta property="og:url" content="https://mikrouli.example.com/" />
    <meta property="og:image" content="https://mikrouli.example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="mikrouli — Shorten your links, track every click" />
    <meta
      name="twitter:description"
      content="Free, simple URL shortener with built-in click analytics."
    />
    <meta name="twitter:image" content="https://mikrouli.example.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        mikrouli requires JavaScript to run. The landing page describes a free URL shortener with
        built-in analytics — please enable JavaScript or visit the
        <a href="/sitemap.xml">sitemap</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
