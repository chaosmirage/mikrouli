# Production SPA server for the built React app.
# nginx-unprivileged listens on 8080. The try_files fallback serves index.html
# for client-side routes (e.g. /login, /register) so deep links do not 404.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent any directory redirect from leaking the listen port in Location.
    # Without this, a trailing-slash redirect would produce an absolute URL
    # with the internal :8080 port (e.g. https://mikrou.li:8080/connect/).
    absolute_redirect off;

    # Runtime config channel: njs emits window.__MIKROULI_CONFIG__ with the
    # current GUEST_SHORTEN_ENABLED value so the SPA can gate the landing form
    # without an image rebuild. js_import lives in conf.d/00-njs.conf.
    location = /config.js {
        js_content runtimeConfig.emit;
        add_header Content-Type "application/javascript" always;
        add_header Cache-Control "no-cache" always;
    }

    # Serve the prerendered static connect page directly at /connect (200, no
    # trailing-slash directory redirect). Parity with the k8s ConfigMap below.
    location = /connect {
        try_files /connect/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
