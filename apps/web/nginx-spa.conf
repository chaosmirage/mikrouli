# Production SPA server for the built React app.
# nginx-unprivileged listens on 8080. The try_files fallback serves index.html
# for client-side routes (e.g. /login, /register) so deep links do not 404.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the prerendered static connect page directly at /connect (no
    # trailing-slash directory redirect, which would otherwise 301 to the
    # internal listen port). Crawlers and agents get the raw HTML at 200.
    location = /connect {
        try_files /connect/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
