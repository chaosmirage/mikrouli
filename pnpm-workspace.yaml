packages:
  - 'apps/*'

# pnpm 11 build-script approval. These deps ship postinstall build scripts that
# must run (nest core wiring, protobufjs codegen, esbuild native binary). pnpm 10+
# refuses to run unapproved build scripts (ERR_PNPM_IGNORED_BUILDS) unless listed.
allowBuilds:
  '@nestjs/core': true
  esbuild: true
  protobufjs: true
