# Runtime flag channel: njs reads GUEST_SHORTEN_ENABLED and emits /config.js
# for the SPA. load_module and env are main-context-only directives; they
# must appear before events {} so the worker inherits the env var and the njs
# module is loaded before any js_content / js_import runs.
load_module modules/ngx_http_js_module.so;
env GUEST_SHORTEN_ENABLED;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Import the njs handler (http-context directive). The script is bind-mounted
    # at /etc/nginx/runtime-config.njs by docker-compose.
    js_import runtimeConfig from /etc/nginx/runtime-config.njs;

    sendfile off;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Use Docker's embedded DNS resolver so upstream hostnames resolve
    # at request time rather than only at config-load time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version      1.1;

        # ----- /config.js -> njs runtime flag channel -----
        # Emits window.__MIKROULI_CONFIG__ = { guestShortenEnabled: <bool> };.
        # The SPA fetches this on mount to decide whether to render the
        # landing-page shorten form. Fail-safe: the hook treats any fetch
        # error as disabled.
        location = /config.js {
            js_content runtimeConfig.emit;
            add_header Content-Type "application/javascript" always;
            add_header Cache-Control "no-cache" always;
        }

        # ----- /:slug -> NestJS redirect (6-char short codes) -----
        # Matches root-level paths that are exactly 6 alphanumeric/underscore
        # characters and rewrites them to /api/:slug so NestJS handles them
        # under the uniform /api global prefix. Forward-compatible with F3.
        location ~ "^/([A-Za-z0-9_]{6})$" {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream/api/$1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID  $http_x_correlation_id;
        }

        # ----- /api/ -> NestJS -----
        location /api/ {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header X-Correlation-ID  $http_x_correlation_id;

            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ----- /@vite/ -> Vite HMR WebSocket -----
        location /@vite/ {
            set $web_upstream http://web-dev:5173;
            proxy_pass $web_upstream;

            proxy_set_header Host       $host;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering    off;
            proxy_read_timeout 86400s;
        }

        # ----- / -> Vite dev server (port 5173) -----
        location / {
            set $web_upstream http://web-dev:5173;
            proxy_pass $web_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
