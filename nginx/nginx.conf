worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Suppress server version disclosure in headers and error pages.
    server_tokens off;

    sendfile off;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Use Docker's embedded DNS resolver so upstream hostnames resolve
    # at request time rather than only at config-load time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version      1.1;

        # Reject requests with a User-Agent header longer than 1024 characters.
        # Oversized UAs are a hallmark of scanner/exploit traffic.
        if ($http_user_agent ~* "^.{1025,}") {
            return 400;
        }

        # Deny access to dotfiles (e.g. .env, .git, .htaccess).
        location ~ /\. {
            deny all;
            return 404;
        }

        # Security headers — applied with `always` so they appear on error responses too.
        # style-src 'unsafe-inline' is required by MUI/Emotion for runtime CSS-in-JS injection.
        add_header X-Content-Type-Options    "nosniff"                     always;
        add_header X-Frame-Options           "DENY"                        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ----- /:slug -> NestJS redirect (6-char short codes) -----
        # Matches root-level paths that are exactly 6 alphanumeric/underscore
        # characters and rewrites them to /api/:slug so NestJS handles them
        # under the uniform /api global prefix. Forward-compatible with F3.
        location ~ "^/([A-Za-z0-9_]{6})$" {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream/api/$1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Repeat security headers: nginx clears parent add_header directives
            # when a location block declares its own (nginx inheritance rule).
            add_header X-Content-Type-Options    "nosniff"                     always;
            add_header X-Frame-Options           "DENY"                        always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # ----- /api/ -> NestJS -----
        location /api/ {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Repeat security headers: nginx clears parent add_header directives
            # when a location block declares its own (nginx inheritance rule).
            add_header X-Content-Type-Options    "nosniff"                     always;
            add_header X-Frame-Options           "DENY"                        always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # ----- / -> nginx-unprivileged production SPA (port 8080) -----
        location / {
            set $web_upstream http://web:8080;
            proxy_pass $web_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Repeat security headers: nginx clears parent add_header directives
            # when a location block declares its own (nginx inheritance rule).
            add_header X-Content-Type-Options    "nosniff"                     always;
            add_header X-Frame-Options           "DENY"                        always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
