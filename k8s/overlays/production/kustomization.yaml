apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mikrouli
resources:
  - ../../base
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: mikrouli
# Production ALWAYS pins to an exact git SHA — floating tags are forbidden.
# CI replaces GITSHA-PLACEHOLDER with ${{ github.sha }} before kubectl apply -k.
images:
  - name: ghcr.io/OWNER/mikrouli-api
    newTag: GITSHA-PLACEHOLDER
  - name: ghcr.io/OWNER/mikrouli-web
    newTag: GITSHA-PLACEHOLDER
