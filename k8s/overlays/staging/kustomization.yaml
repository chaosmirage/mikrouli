apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mikrouli
resources:
  - ../../base
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: mikrouli
# Staging tracks the main branch — CI replaces newTag with the specific git SHA at deploy time
images:
  - name: ghcr.io/OWNER/mikrouli-api
    newTag: main
  - name: ghcr.io/OWNER/mikrouli-web
    newTag: main
# Staging runs with reduced replicas to save cost
replicas:
  - name: api
    count: 1
  - name: web
    count: 1
