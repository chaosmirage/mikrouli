apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mikrouli
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mikrouli
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: mikrouli
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        # NestJS runs as node user (UID 1000) in node:20-alpine
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: ghcr.io/OWNER/mikrouli-api
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: production
            # Migrations run as a dedicated Job before this Deployment rolls out
            - name: MIGRATIONS_RUN
              value: 'false'
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: '5432'
            - name: REDIS_HOST
              value: redis-primary
            - name: REDIS_PORT
              value: '6379'
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_PORT
              value: '8123'
            - name: OTEL_ENABLED
              value: 'true'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: 'http://otel-collector.observability.svc.cluster.local:4318'
            - name: OTEL_SERVICE_NAME
              value: 'mikrouli-api'
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: DEPLOYMENT_ENVIRONMENT
              value: 'production'
          envFrom:
            - secretRef:
                name: mikrouli-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
