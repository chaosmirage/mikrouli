apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-config
  namespace: mikrouli
data:
  default.conf: |
    # Resolver for k8s service DNS so api ClusterIP changes are picked up
    # without requiring an nginx reload.
    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            text/xml
            application/xml
            application/xml+rss
            text/javascript
            image/svg+xml;
        gzip_min_length 256;

        # Proxy API calls to the api Deployment.
        location /api/ {
            set $api_upstream "api.mikrouli.svc.cluster.local";
            proxy_pass http://$api_upstream:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # 6-character short-link redirect — slugs are alphanumeric, length 6.
        # NestJS api has setGlobalPrefix('api'), so /<slug> must be rewritten
        # to /api/<slug> before proxying — see apps/api/src/main.ts.
        location ~ "^/([A-Za-z0-9]{6})$" {
            set $api_upstream "api.mikrouli.svc.cluster.local";
            proxy_pass http://$api_upstream:3000/api/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 5s;
            # Pass redirect responses through verbatim
            proxy_redirect off;
        }

        # Static assets — long-lived cache (content-addressed filenames from Vite)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # SPA fallback — all unmatched paths return index.html for React Router
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
