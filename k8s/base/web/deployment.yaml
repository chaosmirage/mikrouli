apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mikrouli
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: mikrouli
spec:
  # Cost-capped at 1 replica (single static-asset server).
  # The Hetzner LB in front handles traffic burst; nginx static serving is
  # cheap. To go HA, bump to 2 and ensure cluster has ≥ 2 worker nodes.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: mikrouli
    spec:
      serviceAccountName: web
      securityContext:
        runAsNonRoot: true
        # Using nginxinc/nginx-unprivileged which runs as UID 101 on port 8080.
        # The official nginx image runs as root — incompatible with PodSecurity restricted.
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/chaosmirage/mikrouli-web:PLACEHOLDER
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: var-cache-nginx
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: web-nginx-config
        - name: tmp
          emptyDir: {}
        - name: var-cache-nginx
          emptyDir: {}
        - name: var-run
          emptyDir: {}
