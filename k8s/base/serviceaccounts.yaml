# One ServiceAccount per workload. No workload uses the default SA.
# automountServiceAccountToken: false on every SA — no workload needs the k8s API.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: mikrouli
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: mikrouli
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: mikrouli
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: mikrouli
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: mikrouli
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse
  namespace: mikrouli
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-migration
  namespace: mikrouli
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  namespace: mikrouli
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-backup
  namespace: mikrouli
automountServiceAccountToken: false
