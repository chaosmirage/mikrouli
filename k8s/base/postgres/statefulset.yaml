apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mikrouli
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mikrouli
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: mikrouli
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      serviceAccountName: postgres
      securityContext:
        runAsNonRoot: true
        # postgres:16-alpine runs as UID 70 (postgres user)
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            # /var/lib/postgresql/data is a PVC mount; readOnlyRootFilesystem
            # would block postgres from writing its runtime files to /tmp and /run.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Postgres init script reads POSTGRES_USER/PASSWORD/DB; we keep
            # the canonical names DB_USER/DB_PASS/DB_NAME in the Secret and
            # remap them here so the same Secret is reused by api/migrations.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mikrouli-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mikrouli-secrets
                  key: DB_PASS
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mikrouli-secrets
                  key: DB_NAME
          envFrom:
            - secretRef:
                name: mikrouli-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 10Gi
