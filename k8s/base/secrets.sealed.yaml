# SealedSecret — encrypted with the sealed-secrets controller public key.
#
# NEVER commit a plain kind: Secret to git. Only this SealedSecret kind is safe to commit.
#
# To update secrets:
#   1. Create a raw Secret (never commit raw-secret.yaml):
#        kubectl create secret generic mikrouli-secrets \
#          --namespace mikrouli \
#          --dry-run=client -o yaml \
#          --from-literal=DB_USER=myuser \
#          --from-literal=DB_PASS=... \
#          --from-literal=DB_NAME=mikrouli \
#          --from-literal=JWT_SECRET=... \
#          --from-literal=JWT_REFRESH_SECRET=... \
#          --from-literal=S3_ACCESS_KEY=... \
#          --from-literal=S3_SECRET_KEY=... \
#          --from-literal=S3_ENDPOINT=... \
#          --from-literal=S3_BUCKET=... \
#          --from-literal=CLICKHOUSE_PASSWORD=... \
#          > /tmp/raw-secret.yaml
#
#   2. Seal with the controller cert:
#        kubeseal --cert k8s/sealed-secrets.crt \
#          -o yaml < /tmp/raw-secret.yaml \
#          > k8s/base/secrets.sealed.yaml
#        rm /tmp/raw-secret.yaml
#
#   3. Commit k8s/base/secrets.sealed.yaml.
#
# The cipher text below is a placeholder — replace via the steps above before deploying.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mikrouli-secrets
  namespace: mikrouli
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: 'true'
spec:
  encryptedData:
    DB_USER: PLACEHOLDER-SEALED-VALUE
    DB_PASS: PLACEHOLDER-SEALED-VALUE
    DB_NAME: PLACEHOLDER-SEALED-VALUE
    JWT_SECRET: PLACEHOLDER-SEALED-VALUE
    JWT_REFRESH_SECRET: PLACEHOLDER-SEALED-VALUE
    S3_ACCESS_KEY: PLACEHOLDER-SEALED-VALUE
    S3_SECRET_KEY: PLACEHOLDER-SEALED-VALUE
    S3_ENDPOINT: PLACEHOLDER-SEALED-VALUE
    S3_BUCKET: PLACEHOLDER-SEALED-VALUE
    CLICKHOUSE_PASSWORD: PLACEHOLDER-SEALED-VALUE
  template:
    metadata:
      name: mikrouli-secrets
      namespace: mikrouli
    type: Opaque
