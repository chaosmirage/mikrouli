apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: mikrouli
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: mikrouli
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: mikrouli
    spec:
      serviceAccountName: clickhouse
      securityContext:
        runAsNonRoot: true
        # clickhouse/clickhouse-server:24.3-alpine runs as UID 101 (clickhouse user)
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Renders users.xml from the committed template by substituting
        # __SHA256__ with the SHA-256 of CLICKHOUSE_PASSWORD (read from
        # mikrouli-secrets at pod startup). Result lives in an emptyDir
        # mounted into the main container at /etc/clickhouse-server/users.d/.
        # This keeps the password hash out of git entirely.
        - name: render-users-xml
          image: busybox:1.37
          command:
            - sh
            - -ec
            - |
              SHA256=$(printf '%s' "$CLICKHOUSE_PASSWORD" | sha256sum | awk '{print $1}')
              sed "s|__SHA256__|${SHA256}|" /tmpl/users.xml.tmpl > /rendered/users.xml
              chmod 0440 /rendered/users.xml
          envFrom:
            - secretRef:
                name: mikrouli-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: users-config-tmpl
              mountPath: /tmpl
              readOnly: true
            - name: users-config-rendered
              mountPath: /rendered
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          securityContext:
            allowPrivilegeEscalation: false
            # /var/lib/clickhouse needs writable access (PVC mount backs the data dir)
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: mikrouli-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: users-config-rendered
              mountPath: /etc/clickhouse-server/users.d/users.xml
              subPath: users.xml
              readOnly: true
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: users-config-tmpl
          configMap:
            name: clickhouse-users
        - name: users-config-rendered
          emptyDir:
            medium: Memory
            sizeLimit: 64Ki
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 20Gi
