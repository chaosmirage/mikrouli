apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-backup
  namespace: mikrouli
  labels:
    app.kubernetes.io/name: clickhouse-backup
    app.kubernetes.io/part-of: mikrouli
spec:
  # Daily at 03:00 UTC — staggered from the postgres backup at 02:00
  schedule: '0 3 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-backup
            app.kubernetes.io/part-of: mikrouli
        spec:
          serviceAccountName: clickhouse-backup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: clickhouse/clickhouse-server:24.3-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              # Credentials are sourced from environment variables, never passed
              # as CLI arguments, so they do not appear in the process list.
              # The BACKUP statement is piped via --queries-file /dev/stdin to
              # keep S3 credentials out of clickhouse-client argv.
              command:
                - sh
                - -c
                - |
                  BACKUP_SQL="BACKUP DATABASE mikrouli TO S3('${S3_ENDPOINT}/${S3_BUCKET}/clickhouse/$(date +%Y%m%d-%H%M%S)', '${S3_ACCESS_KEY}', '${S3_SECRET_KEY}')"
                  printf '%s' "$BACKUP_SQL" | clickhouse-client \
                    --host clickhouse \
                    --password "$CLICKHOUSE_PASSWORD" \
                    --queries-file /dev/stdin
              env:
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: mikrouli-secrets
                      key: S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: mikrouli-secrets
                      key: S3_BUCKET
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mikrouli-secrets
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mikrouli-secrets
                      key: S3_SECRET_KEY
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mikrouli-secrets
                      key: CLICKHOUSE_PASSWORD
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 256Mi
                  cpu: 250m
          volumes:
            - name: tmp
              emptyDir: {}
