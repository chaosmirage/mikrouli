apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users
  namespace: mikrouli
data:
  users.xml.tmpl: |
    <?xml version="1.0"?>
    <clickhouse>
      <!-- replace="replace" on <users> overrides the entire user list shipped
           in the base /etc/clickhouse-server/users.xml. Without this, the base
           default user (with <no_password/>) collides with our hash entry. -->
      <users replace="replace">
        <default>
          <!-- SHA-256 of CLICKHOUSE_PASSWORD, substituted at pod startup
               by the render-users-xml init container from mikrouli-secrets.
               This keeps the password hash out of git entirely. -->
          <password_sha256_hex>__SHA256__</password_sha256_hex>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>0</access_management>
        </default>
      </users>
      <profiles>
        <default>
          <max_memory_usage>1073741824</max_memory_usage>
          <use_uncompressed_cache>0</use_uncompressed_cache>
          <load_balancing>random</load_balancing>
        </default>
      </profiles>
      <quotas>
        <default>
          <interval>
            <duration>3600</duration>
            <queries>0</queries>
            <errors>0</errors>
            <result_rows>0</result_rows>
            <read_rows>0</read_rows>
            <execution_time>0</execution_time>
          </interval>
        </default>
      </quotas>
    </clickhouse>
