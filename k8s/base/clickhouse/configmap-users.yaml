apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users
  namespace: mikrouli
data:
  users.xml.tmpl: |
    <?xml version="1.0"?>
    <clickhouse>
      <!-- replace="replace" on <users> overrides the entire user list shipped
           in the base /etc/clickhouse-server/users.xml. Without this, the base
           default user (with <no_password/>) collides with our hash entry. -->
      <users replace="replace">
        <default>
          <!-- ClickHouse auth disabled: API client does not pass a password
               (see apps/api/src/clickhouse/clickhouse.service.ts buildClient).
               Network access is enforced at the K8s NetworkPolicy layer —
               only api pods in this namespace can reach ClickHouse, so this
               matches the url-shortener pattern. The init container still
               renders this file from a template for parity with future
               auth-enabled setups; __SHA256__ is harmless if unused. -->
          <no_password/>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>0</access_management>
        </default>
      </users>
      <profiles>
        <default>
          <max_memory_usage>1073741824</max_memory_usage>
          <use_uncompressed_cache>0</use_uncompressed_cache>
          <load_balancing>random</load_balancing>
        </default>
      </profiles>
      <quotas>
        <default>
          <interval>
            <duration>3600</duration>
            <queries>0</queries>
            <errors>0</errors>
            <result_rows>0</result_rows>
            <read_rows>0</read_rows>
            <execution_time>0</execution_time>
          </interval>
        </default>
      </quotas>
    </clickhouse>
