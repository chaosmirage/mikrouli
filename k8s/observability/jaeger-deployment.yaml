apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: observability
spec:
  # PAUSED 2026-10-21: all-in-one (badger, no sampling) holds ~767Mi RSS and does
  # not fit the cx23 budget (full estate headroom ~150Mi); its 2026-10-20 live-only
  # pause was resurrected by the next kustomize apply (this file still said 1) and
  # memory-starved the node into a kswapd thrash loop (cluster-down 2026-10-21).
  # Re-enable ONLY after a node resize (or moving an estate off cx23) AND with:
  # SPAN_STORAGE_TYPE=memory + memory.max-traces, GOMEMLIMIT, api-side sampling,
  # limits <= 512Mi. Operator ruling 2026-10-20: restore is an operator decision.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_SPAN_STORAGE_TTL
              value: "24h"
            - name: BADGER_DIRECTORY_KEY
              value: /badger/data/keys
            - name: BADGER_DIRECTORY_VALUE
              value: /badger/data/values
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: ui
              containerPort: 16686
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: badger-data
              mountPath: /badger/data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: badger-data
          emptyDir: {}
