# Hetzner k3s cluster configuration -- cost-capped at <= EUR 30 / month
# Managed by: https://github.com/vitobotta/hetzner-k3s
# Usage:
#   hetzner-k3s create --config k8s/cluster/hetzner-k3s.yaml
#   hetzner-k3s delete --config k8s/cluster/hetzner-k3s.yaml
#
# Cost breakdown (Hetzner Cloud, EUR/month, prices as of April 2026):
#   1 x cx23 control-plane (workloads on master): EUR 3.99
#   burst pool (cx23, 0->1):              EUR 0.00 - 3.99
#   30 GB volumes (postgres+clickhouse+redis):     EUR 1.32
#   1 x Hetzner Load Balancer (LB11):              EUR 5.39
#   1 x IPv4 (primary, included in LB):            EUR 0.00
#   ---------------------------------------------------
#   TOTAL:                                  ~EUR 10.70 - 14.70 / month
#
# Topology: 1 x cx23 master (workloads on master) + burst pool (cx23, 0->1,
# cap 1). The single-master setup means a control-plane failure halts new
# deployments until the node is replaced; running workloads continue serving.
# This is an explicit cost-vs-availability trade-off.
# metrics-server is bundled by k3s (not disabled); cluster-autoscaler is
# provided by hetzner-k3s built-in autoscaling (the autoscaling: block below).

cluster_name: mikrouli
protect_against_deletion: false
kubeconfig_path: ~/.kube/mikrouli.yaml
k3s_version: v1.29.4+k3s1
public_ssh_key_path: ~/.ssh/id_ed25519.pub
private_ssh_key_path: ~/.ssh/id_ed25519
use_ssh_agent: true

# Replace <OPERATOR_CIDR> with your egress CIDR (e.g. 203.0.113.0/24) before
# applying this config. The placeholder intentionally prevents world-open SSH
# and API access; the cluster will not be reachable until a real CIDR is set.
ssh_allowed_networks:
  - <OPERATOR_CIDR>
api_allowed_networks:
  - <OPERATOR_CIDR>

private_network_subnet: 10.0.0.0/16
disable_flannel: false

# Control-plane co-hosts workloads; single master, no HA.
schedule_workloads_on_masters: true

masters_pool:
  instance_type: cx23
  instance_count: 1
  locations:
    - nbg1

worker_node_pools:
  - name: burst
    instance_type: cx23
    locations:
      - nbg1
    autoscaling:
      enabled: true
      min_instances: 0
      max_instances: 1

# k3s additional server args (passed to every control-plane node)
k3s_server_args:
  - '--disable=traefik' # install traefik via Helm chart to control version

# Install these components via Helm after cluster creation
additional_packages: []
post_create_commands: []
