name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recompile typespec spec
        run: pnpm --filter api spec:compile

      - name: Regenerate openapi types
        run: pnpm spec:types

      - name: Detect spec/type drift
        run: |
          git diff --exit-code -- \
            apps/api/spec/tsp-output \
            apps/api/src/types/openapi-generated.ts \
            apps/web/src/api/openapi-generated.ts

      - name: Lint api
        run: pnpm --filter api lint

      - name: Lint web
        run: pnpm --filter web lint

      - name: Test api
        run: pnpm --filter api test

      - name: Test web
        run: pnpm --filter web test

      - name: Build api
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    env:
      # The observability stack is rendered and gated as the same unit the
      # deploy path applies (kubectl apply -k k8s/observability), so the values
      # that ship are the values that are checked.
      OBSERVABILITY_DIR: k8s/observability
      POLICY_DIR: k8s/policy
      RENDERED_MANIFEST: rendered-observability.yaml
      BASE_DIR: k8s/base
      PRODUCTION_DIR: k8s/overlays/production
      RENDERED_BASE: rendered-base.yaml
      RENDERED_PRODUCTION: rendered-production.yaml
      REDIS_POLICY_NAMESPACE: redis_replication
      # Pinned to explicit releases (no floating latest) to keep the gate
      # reproducible across runs.
      KUBECONFORM_VERSION: '0.8.0'
      CONFTEST_VERSION: '0.68.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install kubeconform
        run: |
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Install conftest
        run: |
          curl -fsSL \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest
          conftest --version

      - name: Render observability manifests
        run: kubectl kustomize "$OBSERVABILITY_DIR" > "$RENDERED_MANIFEST"

      - name: Validate rendered manifests against Kubernetes schemas
        run: kubeconform -strict -summary "$RENDERED_MANIFEST"

      - name: Run policy unit tests
        run: conftest verify --policy "$POLICY_DIR"

      - name: Enforce policy on rendered manifests
        run: conftest test --policy "$POLICY_DIR" "$RENDERED_MANIFEST"

      - name: Render base manifests
        run: kubectl kustomize "$BASE_DIR" > "$RENDERED_BASE"

      - name: Validate base against Kubernetes schemas
        run: kubeconform -strict -ignore-missing-schemas -summary "$RENDERED_BASE"

      - name: Enforce redis replication policy on base
        run: conftest test --combine --namespace "$REDIS_POLICY_NAMESPACE" --policy "$POLICY_DIR" "$RENDERED_BASE"

      - name: Render production manifests
        run: kubectl kustomize "$PRODUCTION_DIR" > "$RENDERED_PRODUCTION"

      - name: Validate production against Kubernetes schemas
        run: kubeconform -strict -ignore-missing-schemas -summary "$RENDERED_PRODUCTION"

      - name: Enforce redis replication policy on production
        run: conftest test --combine --namespace "$REDIS_POLICY_NAMESPACE" --policy "$POLICY_DIR" "$RENDERED_PRODUCTION"
