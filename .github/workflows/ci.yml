name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recompile typespec spec
        run: pnpm --filter api spec:compile

      - name: Regenerate openapi types
        run: pnpm spec:types

      - name: Detect spec/type drift
        run: |
          git diff --exit-code -- \
            apps/api/spec/tsp-output \
            apps/api/src/types/openapi-generated.ts \
            apps/web/src/api/openapi-generated.ts

      - name: Lint api
        run: pnpm --filter api lint

      - name: Lint web
        run: pnpm --filter web lint

      - name: Test api
        run: pnpm --filter api test

      - name: Test web
        run: pnpm --filter web test

      - name: Build api
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build
