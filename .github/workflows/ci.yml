name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recompile typespec spec
        run: pnpm --filter api spec:compile

      - name: Regenerate openapi types
        run: pnpm spec:types

      - name: Detect spec/type drift
        run: |
          git diff --exit-code -- \
            apps/api/spec/tsp-output \
            apps/api/src/types/openapi-generated.ts \
            apps/web/src/api/openapi-generated.ts

      - name: Lint api
        run: pnpm --filter api lint

      - name: Lint web
        run: pnpm --filter web lint

      - name: Test api
        run: pnpm --filter api test

      - name: Test web
        run: pnpm --filter web test

      - name: Build api
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build

  e2e:
    name: Playwright E2E Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Start docker-compose stack
        run: docker compose up -d --build

      - name: Wait for stack to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/api/health; then
              echo "Stack is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time"
          exit 1

      - name: Run Playwright e2e tests
        run: pnpm --filter web e2e
        env:
          CI: true
          E2E_BASE_URL: http://localhost:8888

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 7
