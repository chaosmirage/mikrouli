name: Build, Test, Scan, and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/mikrouli-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/mikrouli-web

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recompile typespec spec
        run: pnpm --filter api spec:compile

      - name: Regenerate openapi types
        run: pnpm spec:types

      - name: Detect spec/type drift
        run: |
          git diff --exit-code -- \
            apps/api/spec/tsp-output \
            apps/api/src/types/openapi-generated.ts \
            apps/web/src/api/openapi-generated.ts

      - name: Lint api
        run: pnpm --filter api lint

      - name: Lint web
        run: pnpm --filter web lint

      - name: Test api
        run: pnpm --filter api test

      - name: Test web
        run: pnpm --filter web test

      - name: Build api
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build

  e2e:
    name: Playwright E2E Tests
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Seed CI .env from example
        run: cp .env.example .env

      - name: Start docker-compose stack
        run: docker compose up -d --build

      - name: Wait for stack to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/api/health; then
              echo "Stack is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time"
          docker compose logs --no-color --tail 100 || true
          exit 1

      # Run the suite from the official Playwright image: browsers + OS deps are
      # baked into the image, so there is NO browser-download step (the previous
      # flaky-CDN download hang cannot happen). --network host lets the container
      # reach the stack at http://localhost:8888 (the published nginx port); using
      # localhost also keeps a secure browser context so the Clipboard API works.
      # The image tag MUST track the @playwright/test version in pnpm-lock.yaml.
      - name: Run Playwright e2e tests
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/work" -w /work \
            -e CI=true \
            -e E2E_BASE_URL=http://localhost:8888 \
            -e HOME=/tmp \
            mcr.microsoft.com/playwright:v1.59.1-noble \
            sh -c 'corepack enable && pnpm install --frozen-lockfile && cd apps/web && node_modules/.bin/playwright test'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 7

  build-and-scan:
    name: Build, Scan, and Push Images
    needs: e2e
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy prints findings as a table directly in the runner log.
      # No SARIF upload because Code Scanning requires GitHub Advanced
      # Security (not available on private repos). exit-code=0 keeps the
      # scan informational; CVEs are visible in the workflow log.
      - name: Scan api image with Trivy
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      - name: Scan web image with Trivy
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

  deploy-production:
    name: Deploy to Production
    needs: [build-and-scan, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure kubectl for production
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_PRODUCTION" > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBECONFIG_PRODUCTION: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Pin image tags to current SHA (never :latest)
        run: |
          sed -i "s/GITSHA-PLACEHOLDER/${{ github.sha }}/g" \
            k8s/overlays/production/kustomization.yaml

      - name: Verify mikrouli-secrets exists in cluster
        run: |
          # Application secrets are created out-of-band by the operator
          # (see k8s/README.md § Secrets). Fail fast if missing — otherwise
          # the api Deployment would crash-loop on envFrom.
          kubectl get secret -n mikrouli mikrouli-secrets >/dev/null

      - name: Deploy to production
        run: kubectl apply -k k8s/overlays/production

      - name: Wait for api rollout
        run: kubectl rollout status deployment/api -n mikrouli --timeout=10m

      - name: Wait for web rollout
        run: kubectl rollout status deployment/web -n mikrouli --timeout=10m
