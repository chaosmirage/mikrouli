name: Build, Test, Scan, and Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/mikrouli-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/mikrouli-web

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recompile typespec spec
        run: pnpm --filter api spec:compile

      - name: Regenerate openapi types
        run: pnpm spec:types

      - name: Detect spec/type drift
        run: |
          git diff --exit-code -- \
            apps/api/spec/tsp-output \
            apps/api/src/types/openapi-generated.ts \
            apps/web/src/api/openapi-generated.ts

      - name: Lint api
        run: pnpm --filter api lint

      - name: Lint web
        run: pnpm --filter web lint

      - name: Test api
        run: pnpm --filter api test

      - name: Test web
        run: pnpm --filter web test

      - name: Build api
        run: pnpm --filter api build

      - name: Build web
        run: pnpm --filter web build

  e2e:
    name: Playwright E2E Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Seed CI .env from example
        run: cp .env.example .env

      - name: Start docker-compose stack
        run: docker compose up -d --build

      - name: Wait for stack to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/api/health; then
              echo "Stack is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time"
          exit 1

      - name: Run Playwright e2e tests
        run: pnpm --filter web e2e
        env:
          CI: true
          E2E_BASE_URL: http://localhost:8888

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 7

  build-and-scan:
    name: Build, Scan, and Push Images
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan api image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-api-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan web image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-web-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload api scan results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-api-results.sarif

      - name: Upload web scan results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-web-results.sarif

  deploy-production:
    name: Deploy to Production
    needs: [build-and-scan, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure kubectl for production
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_PRODUCTION" > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBECONFIG_PRODUCTION: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Pin image tags to current SHA (never :latest)
        run: |
          sed -i "s/GITSHA-PLACEHOLDER/${{ github.sha }}/g" \
            k8s/overlays/production/kustomization.yaml

      - name: Ensure namespace exists
        run: |
          kubectl create namespace mikrouli --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Sync mikrouli-secrets from GitHub Secrets
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Build a Secret manifest on stdin only — never written to disk,
          # never on a kubectl arg list. Apply idempotently so reruns rotate
          # values without manual delete.
          umask 077
          ENV_FILE="$(mktemp)"
          trap 'shred -u "$ENV_FILE" 2>/dev/null || rm -f "$ENV_FILE"' EXIT
          {
            printf 'DB_USER=%s\n'             "$DB_USER"
            printf 'DB_PASS=%s\n'             "$DB_PASS"
            printf 'DB_NAME=%s\n'             "$DB_NAME"
            printf 'JWT_SECRET=%s\n'          "$JWT_SECRET"
            printf 'JWT_REFRESH_SECRET=%s\n'  "$JWT_REFRESH_SECRET"
            printf 'CLICKHOUSE_PASSWORD=%s\n' "$CLICKHOUSE_PASSWORD"
            printf 'S3_ACCESS_KEY=%s\n'       "$S3_ACCESS_KEY"
            printf 'S3_SECRET_KEY=%s\n'       "$S3_SECRET_KEY"
            printf 'S3_ENDPOINT=%s\n'         "$S3_ENDPOINT"
            printf 'S3_BUCKET=%s\n'           "$S3_BUCKET"
          } > "$ENV_FILE"
          kubectl create secret generic mikrouli-secrets \
            --namespace mikrouli \
            --from-env-file="$ENV_FILE" \
            --dry-run=client -o yaml \
          | kubectl apply -f -

      - name: Deploy to production
        run: kubectl apply -k k8s/overlays/production

      - name: Wait for api rollout
        run: kubectl rollout status deployment/api -n mikrouli --timeout=10m

      - name: Wait for web rollout
        run: kubectl rollout status deployment/web -n mikrouli --timeout=10m
