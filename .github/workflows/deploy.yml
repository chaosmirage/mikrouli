name: Deploy (fast path)

# Минимальный путь: build → push → kubectl apply.
# Без test / e2e / Trivy — для быстрых деплоев и cutover'а.
# Полный pipeline с проверками — в build-and-deploy.yml.

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/mikrouli-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/mikrouli-web

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure kubectl for production
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_PRODUCTION" > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBECONFIG_PRODUCTION: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Pin image tags to current SHA
        run: |
          sed -i "s/GITSHA-PLACEHOLDER/${{ github.sha }}/g" \
            k8s/overlays/production/kustomization.yaml

      - name: Verify mikrouli-secrets exists in cluster
        run: |
          # mikrouli-secrets создан out-of-band оператором (см. k8s/README.md § Secrets).
          kubectl get secret -n mikrouli mikrouli-secrets >/dev/null

      - name: Deploy to production
        run: kubectl apply -k k8s/overlays/production

      - name: Wait for api rollout
        run: kubectl rollout status deployment/api -n mikrouli --timeout=10m

      - name: Wait for web rollout
        run: kubectl rollout status deployment/web -n mikrouli --timeout=10m
