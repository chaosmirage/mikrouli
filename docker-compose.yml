# docker-compose.yml
#
# Architecture overview:
#   nginx (port 8888) — public entry point; routes /api/* to NestJS, /* to React
#   api               — NestJS application (internal, port 3000)
#   web               — React/Vite SPA served by nginx-unprivileged (internal, port 8080)
#   postgres          — relational database
#   redis-primary     — primary cache node
#   redis-replica     — read replica, replicates from redis-primary
#   clickhouse        — analytics / statistics store
#
# Profiles (mutually exclusive; the shared backing services carry no profile and
# run under both):
#   prod (default) — production/e2e stack: web = nginx static (production target,
#                    :8080) behind nginx on :8888. Selected by COMPOSE_PROFILES=prod
#                    in .env, so `docker compose up` (and CI's e2e job) use it.
#   dev            — local HMR stack: web-dev = vite (:5173) + nginx-dev on :8888.
#                    Bring up with: docker compose --profile dev up
#                    (the CLI flag overrides COMPOSE_PROFILES, so the prod nginx/web
#                    do not start and there is no :8888 collision).
#
# Named volumes keep postgres and clickhouse data across `docker compose down`.
# Every service declares a healthcheck so `docker compose ps` reports a real
# health status rather than the default "Up" string.

services:
  nginx:
    profiles:
      - prod
    image: nginx:1.27-alpine
    ports:
      - '8888:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:80/api/health || wget -qO- http://localhost:80/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-dev-postgres-password-not-for-production}
      DB_NAME: ${DB_NAME:-mikrouli}
      REDIS_HOST: redis-primary
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password-not-for-production}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev-clickhouse-password-not-for-production}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-not-for-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-jwt-refresh-secret-not-for-production}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-placeholder}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-placeholder}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8888/api/auth/github/callback}
      TRUST_PROXY_HOPS: '1'
      OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://jaeger:4318'
      OTEL_SERVICE_NAME: 'mikrouli-api'
      SERVICE_VERSION: 'dev'
      DEPLOYMENT_ENVIRONMENT: 'docker-compose'
      PUBLIC_BASE_URL: '${PUBLIC_BASE_URL:-https://mikrou.li}'
      MONTHLY_LINK_LIMIT: ${MONTHLY_LINK_LIMIT:-100}
      MONTHLY_KEY_LIMIT: ${MONTHLY_KEY_LIMIT:-10}
      GUEST_SHORTEN_ENABLED: ${GUEST_SHORTEN_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    profiles:
      - prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    expose:
      - '8080'
    environment:
      # Consumed by the njs-served /config.js; toggling + restart flips the
      # landing form without an image rebuild.
      GUEST_SHORTEN_ENABLED: ${GUEST_SHORTEN_ENABLED:-true}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # dev-profile web: vite HMR dev server with live source bind-mounts.
  # Brought up only via: docker compose --profile dev up
  web-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    expose:
      - '5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:5173']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    expose:
      - '5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-dev-postgres-password-not-for-production}
      POSTGRES_DB: ${DB_NAME:-mikrouli}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mikrouli}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-primary:
    image: redis:7-alpine
    expose:
      - '6379'
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev-redis-password-not-for-production}
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis-replica:
    image: redis:7-alpine
    expose:
      - '6379'
    command: redis-server --replicaof redis-primary 6379 --requirepass ${REDIS_PASSWORD:-dev-redis-password-not-for-production} --masterauth ${REDIS_PASSWORD:-dev-redis-password-not-for-production}
    depends_on:
      redis-primary:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    expose:
      - '8123'
      - '9000'
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev-clickhouse-password-not-for-production}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/allow-external.xml:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Jaeger all-in-one — OpenTelemetry traces backend + UI for local development.
  # UI: http://localhost:16686
  # OTLP receiver: jaeger:4318 (HTTP/proto, matches the OTel SDK default)
  # In-memory storage; restarting the container wipes traces — that is fine for dev.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - '127.0.0.1:16686:16686' # Jaeger UI — loopback only; LAN cannot reach
      - '127.0.0.1:4318:4318' # OTLP HTTP — loopback only
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:16686/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # dev-profile nginx: routes to the vite HMR dev server (web-dev:5173).
  # Brought up only via: docker compose --profile dev up
  # Uses nginx/Dockerfile.nginx-dev so the njs module is installed (the dev
  # edge serves /config.js; the prod edge does not, it proxies / to the web
  # container where njs lives).
  nginx-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: nginx/Dockerfile.nginx-dev
    ports:
      - '8888:80'
    environment:
      # Consumed by the njs-served /config.js on the dev edge.
      GUEST_SHORTEN_ENABLED: ${GUEST_SHORTEN_ENABLED:-true}
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/scripts/runtime-config.njs:/etc/nginx/runtime-config.njs:ro
    depends_on:
      api:
        condition: service_healthy
      web-dev:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:80/api/health || wget -qO- http://localhost:80/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
